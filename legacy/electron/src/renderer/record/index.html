<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src appimg:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>完成记录</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: transparent; overflow: hidden;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        color: #1c1c1e; user-select: none;
      }
      .wrap {
        width: 100%; height: 100%;
        display: flex; flex-direction: column;
        border-radius: 14px; overflow: hidden;
        background: rgba(255, 255, 255, 0.98);
        border: 1px solid rgba(0, 0, 0, 0.09);
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.3);
      }

      /* ---- 顶栏 ---- */
      .hdr {
        -webkit-app-region: drag;
        flex: none;
        display: flex; align-items: center; gap: 8px;
        padding: 10px 10px 10px 12px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }
      .tag {
        flex: none;
        font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
        padding: 2px 8px; border-radius: 6px;
        background: rgba(139, 92, 246, 0.14); color: #6d28d9;
        text-transform: uppercase;
      }
      .tag.todo { background: rgba(37, 99, 235, 0.14); color: #1d4ed8; }
      .ttl {
        flex: 1; min-width: 0;
        font-size: 12.5px; font-weight: 600; color: #2c2c2e;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .hdr button {
        -webkit-app-region: no-drag; flex: none;
        appearance: none; border: 0; cursor: pointer;
        width: 26px; height: 26px; border-radius: 7px;
        background: transparent; color: #a1a1a6; font-size: 13px;
        font-family: inherit;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.12s;
      }
      .hdr button:hover { background: rgba(0, 0, 0, 0.07); color: #1c1c1e; }
      #close:hover { background: rgba(239, 68, 68, 0.14); color: #dc2626; }

      /* ---- 主体 ---- */
      .body {
        flex: 1; min-height: 0;
        display: flex; flex-direction: column; gap: 12px;
        padding: 12px 14px 14px;
        overflow-y: auto;
      }
      .body::-webkit-scrollbar { width: 7px; }
      .body::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.14); border-radius: 4px; }

      .top { display: flex; gap: 11px; align-items: flex-start; flex: none; }
      .thumb {
        width: 96px; height: 68px; flex: none;
        object-fit: cover; border-radius: 8px;
        border: 1px solid rgba(0, 0, 0, 0.09);
        background: #f4f4f5;
      }
      .thumb-ph {
        width: 96px; height: 68px; flex: none;
        display: flex; align-items: center; justify-content: center;
        font-size: 26px; font-weight: 600; color: #fff;
        border-radius: 8px;
        background: linear-gradient(150deg, #a78bfa, #7c3aed);
      }
      .facts { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
      .fact { font-size: 11px; color: #8a8a8e; display: flex; gap: 6px; }
      .fact b { color: #3a3a3c; font-weight: 600; min-width: 76px; }

      .sec-lbl {
        font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
        color: #a1a1a6; text-transform: uppercase;
        display: flex; align-items: center; gap: 6px;
      }
      .sec-lbl::after {
        content: ''; flex: 1; height: 1px; background: rgba(0, 0, 0, 0.07);
      }

      /* ---- 写心得 ---- */
      #reflection {
        width: 100%; flex: none; height: 132px; resize: none;
        border: 1px solid rgba(0, 0, 0, 0.12); border-radius: 9px;
        background: #fff; color: #1c1c1e;
        padding: 9px 10px;
        font-family: inherit; font-size: 12.5px; line-height: 1.6;
        outline: none; user-select: text;
      }
      #reflection::placeholder { color: #bcbcc2; }
      #reflection:focus { border-color: rgba(139, 92, 246, 0.6); }

      /* ---- 读心得 ---- */
      .quote {
        font-size: 12.5px; line-height: 1.75; color: #2c2c2e;
        padding: 11px 13px;
        border-radius: 9px;
        background: linear-gradient(150deg, rgba(168, 85, 247, 0.09), rgba(168, 85, 247, 0.03));
        border-left: 3px solid #a855f7;
        white-space: pre-wrap; word-break: break-word;
        user-select: text;
      }
      .quote.empty { color: #a1a1a6; font-style: italic; border-left-color: rgba(0,0,0,.12);
        background: rgba(0, 0, 0, 0.02); }

      /* ---- 小结 ---- */
      .summary {
        font-size: 12px; line-height: 1.7; color: #3a3a3c;
        padding: 10px 12px; border-radius: 9px;
        background: rgba(139, 92, 246, 0.07);
        border: 1px solid rgba(139, 92, 246, 0.16);
      }
      .stats {
        display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
      }
      .stat {
        padding: 8px 10px; border-radius: 9px;
        background: rgba(0, 0, 0, 0.026);
        border: 1px solid rgba(0, 0, 0, 0.05);
        display: flex; flex-direction: column; gap: 2px;
      }
      .stat .k { font-size: 9.5px; color: #a1a1a6; }
      .stat .v { font-size: 12.5px; font-weight: 600; color: #1c1c1e; }
      .stat .v small { font-size: 10px; font-weight: 400; color: #8a8a8e; margin-left: 3px; }

      /* ---- 底部按钮 ---- */
      .foot {
        flex: none;
        display: flex; align-items: center; gap: 8px;
        padding: 10px 14px 13px;
        border-top: 1px solid rgba(0, 0, 0, 0.06);
      }
      .counter { font-size: 10px; color: #b0b0b6; }
      .sp { flex: 1; }
      .btn {
        appearance: none; cursor: pointer; font-family: inherit;
        border-radius: 9px; padding: 8px 14px;
        font-size: 12px; font-weight: 600;
        transition: all 0.12s;
      }
      .btn-ghost {
        border: 1px solid rgba(0, 0, 0, 0.11);
        background: #fff; color: #7a7a80;
      }
      .btn-ghost:hover { background: #f7f7f8; color: #2c2c2e; }
      .btn-go {
        border: 1px solid transparent; color: #fff;
        background: linear-gradient(160deg, #a855f7, #7c3aed);
        box-shadow: 0 3px 12px rgba(139, 92, 246, 0.32);
      }
      .btn-go:hover { filter: brightness(1.08); }
      .btn-go:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hdr">
        <span class="tag" id="tag">Wantdo</span>
        <span class="ttl" id="ttl">—</span>
        <button id="close" title="关闭">✕</button>
      </div>

      <div class="body" id="body"></div>

      <div class="foot" id="foot"></div>
    </div>
    <script src="record.js"></script>
  </body>
</html>
